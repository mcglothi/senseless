[project]
name = "senseless"
version = "0.1.0"
description = "Local-first replacement for the Sense energy monitor app: own the data, do our own detection."
requires-python = ">=3.12"
dependencies = [
    "websockets>=14",
    "requests>=2.31",
    "aiohttp>=3.10",
    "tzdata>=2024.1",
    "pypdf>=6.21.0",
]

[project.scripts]
senseless = "senseless.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
